<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Currículo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #202124;
            font-family: Arial, sans-serif;
        }

        /* ÁREA PRINCIPAL */
        .viewer {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* BARRA SUPERIOR */
        .toolbar {
            height: 58px;
            min-height: 58px;
            background: #292a2d;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.35);
            z-index: 10;
        }

        .toolbar button {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: #fff;
            font-size: 21px;
            cursor: pointer;
            transition: 0.2s;
        }

        .toolbar button:hover {
            background: rgba(255,255,255,0.12);
        }

        .toolbar button:active {
            transform: scale(0.94);
        }

        .zoom-level {
            min-width: 55px;
            color: #fff;
            text-align: center;
            font-size: 14px;
            user-select: none;
        }

        .separator {
            width: 1px;
            height: 28px;
            background: rgba(255,255,255,0.2);
            margin: 0 5px;
        }

        /* ÁREA DO DOCUMENTO */
        .document-area {
            flex: 1;
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 25px;
            background: #525659;
        }

        .pdf-container {
            position: relative;
            background: white;
            box-shadow: 0 4px 18px rgba(0,0,0,0.45);
            transform-origin: top center;
            transition: width 0.2s ease;
        }

        iframe {
            display: block;
            border: none;
            width: 100%;
            height: 100%;
            background: white;
        }

        /* MENSAGEM DE ERRO */
        .error {
            display: none;
            position: fixed;
            inset: 0;
            background: #202124;
            color: white;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
            z-index: 100;
        }

        .error-content {
            max-width: 500px;
        }

        .error h2 {
            margin-bottom: 12px;
        }

        .error p {
            color: #ccc;
            line-height: 1.6;
        }

        .error code {
            display: inline-block;
            margin-top: 12px;
            padding: 8px 12px;
            background: #333;
            border-radius: 6px;
            color: #fff;
        }

        /* MOBILE */
        @media (max-width: 600px) {

            .toolbar {
                height: 52px;
                min-height: 52px;
                gap: 2px;
                padding: 5px;
            }

            .toolbar button {
                width: 40px;
                height: 40px;
                font-size: 19px;
            }

            .zoom-level {
                min-width: 48px;
                font-size: 13px;
            }

            .separator {
                margin: 0 2px;
            }

            .document-area {
                padding: 12px;
            }
        }
    </style>
</head>

<body>

<div class="viewer">

    <!-- BARRA DE CONTROLES -->
    <div class="toolbar">

        <button onclick="zoomOut()" title="Diminuir zoom">
            −
        </button>

        <div class="zoom-level" id="zoomLevel">
            100%
        </div>

        <button onclick="zoomIn()" title="Aumentar zoom">
            +
        </button>

        <div class="separator"></div>

        <button onclick="fitPage()" title="Ajustar à tela">
            ⛶
        </button>

        <button onclick="downloadPDF()" title="Baixar currículo">
            ↓
        </button>

        <button onclick="openFullscreen()" title="Tela cheia">
            ⛶
        </button>

    </div>

    <!-- DOCUMENTO -->
    <main class="document-area" id="documentArea">

        <div class="pdf-container" id="pdfContainer">

            <iframe
                id="pdfViewer"
                src="curriculo.pdf#toolbar=0&navpanes=0&scrollbar=1"
                title="Currículo">
            </iframe>

        </div>

    </main>

</div>

<!-- ERRO -->
<div class="error" id="error">
    <div class="error-content">

        <h2>Currículo não encontrado</h2>

        <p>
            Verifique se o arquivo PDF está na mesma pasta deste
            arquivo HTML e se o nome está exatamente assim:
        </p>

        <code>curriculo.pdf</code>

    </div>
</div>

<script>

    let zoom = 1;

    const pdfContainer = document.getElementById("pdfContainer");
    const documentArea = document.getElementById("documentArea");
    const zoomLevel = document.getElementById("zoomLevel");
    const pdfViewer = document.getElementById("pdfViewer");

    /*
     * TAMANHO INICIAL
     *
     * A4 aproximado em pixels.
     */
    function setInitialSize() {

        const areaWidth = documentArea.clientWidth;
        const areaHeight = documentArea.clientHeight;

        const maxWidth = Math.min(areaWidth - 50, 900);
        const maxHeight = areaHeight - 50;

        let width = maxWidth;
        let height = width * 1.414;

        if (height > maxHeight) {
            height = maxHeight;
            width = height / 1.414;
        }

        pdfContainer.style.width = width + "px";
        pdfContainer.style.height = height + "px";
    }

    /*
     * ZOOM +
     */
    function zoomIn() {

        zoom += 0.1;

        if (zoom > 2.5) {
            zoom = 2.5;
        }

        applyZoom();
    }

    /*
     * ZOOM -
     */
    function zoomOut() {

        zoom -= 0.1;

        if (zoom < 0.5) {
            zoom = 0.5;
        }

        applyZoom();
    }

    /*
     * APLICA ZOOM
     */
    function applyZoom() {

        const baseWidth = Math.min(
            documentArea.clientWidth - 50,
            900
        );

        const baseHeight = baseWidth * 1.414;

        pdfContainer.style.width =
            (baseWidth * zoom) + "px";

        pdfContainer.style.height =
            (baseHeight * zoom) + "px";

        zoomLevel.textContent =
            Math.round(zoom * 100) + "%";
    }

    /*
     * AJUSTAR À TELA
     */
    function fitPage() {

        zoom = 1;

        setInitialSize();

        zoomLevel.textContent = "100%";

        documentArea.scrollTo({
            top: 0,
            left: 0,
            behavior: "smooth"
        });
    }

    /*
     * DOWNLOAD
     */
    function downloadPDF() {

        const link = document.createElement("a");

        link.href = "curriculo.pdf";
        link.download = "Curriculo.pdf";

        document.body.appendChild(link);

        link.click();

        document.body.removeChild(link);
    }

    /*
     * TELA CHEIA
     */
    function openFullscreen() {

        const element = document.documentElement;

        if (!document.fullscreenElement) {

            if (element.requestFullscreen) {
                element.requestFullscreen();
            }

        } else {

            if (document.exitFullscreen) {
                document.exitFullscreen();
            }

        }
    }

    /*
     * VERIFICA SE O PDF CARREGOU
     */
    pdfViewer.addEventListener("error", function() {

        document.getElementById("error").style.display = "flex";

    });

    /*
     * RESPONSIVIDADE
     */
    window.addEventListener("resize", function() {

        if (zoom === 1) {
            setInitialSize();
        }

    });

    /*
     * INICIALIZA
     */
    window.addEventListener("load", function() {

        setInitialSize();

    });

</script>

</body>
</html>
